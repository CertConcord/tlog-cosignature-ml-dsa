name: Draft validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  draft:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.15.0
      - run: npm run check
      - run: npm test
      - run: python3 tools/verify-key-candidate-accessor-vectors.py
      - run: python3 tools/verify-candidate-array-vectors.py
      - run: python3 tools/verify-candidate-record-vectors.py
      - run: python3 tools/verify-keyobject-boundary-vectors.py
      - run: python3 tools/verify-proof-array-vectors.py
      - run: python3 tools/verify-proof-buffer-vectors.py
      - run: python3 tools/verify-root-buffer-vectors.py
      - run: python3 tools/verify-response-buffer-vectors.py
      - run: python3 tools/verify-context-root-vectors.py
      - run: python3 tools/verify-key-hint-buffer-vectors.py
      - run: python3 tools/verify-signature-verify-buffer-vectors.py
      - run: python3 tools/verify-log-key-id-buffer-vectors.py
      - run: python3 tools/verify-checkpoint-accessor-vectors.py
      - run: python3 tools/verify-revoked-keyobject-vectors.py
      - run: python3 tools/verify-subtree-consistency-vectors.py
      - run: python3 tools/verify-subtree-response-auth-vectors.py
      - run: python3 tools/verify-subtree-http-vectors.py
      - run: python3 tools/verify-subtree-http-client-vectors.py
